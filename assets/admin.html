<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recess Admin</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/agentsandbox.css">
  <link rel="stylesheet" href="/admin.css">
  <script src="/cli.js" defer></script>
  <script src="/theatre.js" defer></script>
  <script src="/admin.js" defer></script>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <header class="bar">
    <div class="brand"><span class="mark" aria-hidden="true"></span>Recess <em>admin</em></div>
    <div id="counts" class="counts" aria-label="Agents by state"></div>
    <div class="bar-right">
      <label class="view-pick" title="What the page shows; switching keeps your run">
        <span>View</span>
        <select id="view">
          <option value="classic">Classic</option>
          <option value="agentsandbox">AgentSandbox</option>
          <option value="admin" selected>Admin</option>
        </select>
      </label>
      <input id="filter" class="filter" type="search" spellcheck="false" placeholder="filter: name, owner, namespace, host" aria-label="Filter agents">
      <span id="live" class="pill" title="The stream from this server">connecting</span>
    </div>
  </header>

  <!-- The inspector: the details of what is picked: an agent, a gateway, a pool or VM, a station. -->
  <aside id="insp" class="insp" hidden>
    <div class="insp-head">
      <div class="tabs" role="tablist">
        <button id="tab-details" class="tab on" role="tab" type="button">Details</button>
        <button id="tab-output" class="tab" role="tab" type="button" hidden>Output <span id="term-count" class="dim"></span></button>
      </div>
      <button id="insp-close" class="ghost small" type="button" title="Hide (Esc)">Hide</button>
    </div>
    <div id="details" class="details" tabindex="0"></div>
    <div id="linewrap" class="linewrap" hidden><pre id="lines" class="lines" tabindex="0"></pre></div>
  </aside>

  <footer id="caption" class="caption" aria-live="polite">
    <div id="cap-title" class="cap-title">Every live agent</div>
    <div id="cap-detail" class="cap-detail"></div>
    <div id="cap-notes" class="cap-fix" hidden></div>
    <div class="cap-hint">click an agent, a gateway or a policy · drag to orbit · shift-drag or ⌘-drag to pan · scroll to zoom<span class="layout-hint" hidden> · ctrl- or ⌥-drag to move, kept · shift-⌘-drag to mark several, then ⌥-drag one to move them all</span> · Esc to let go</div>
  </footer>
</body>
</html>
