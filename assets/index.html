<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recess</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/cli.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span>Recess <span class="dim">for mediatore</span></div>
    <div class="run-status" id="run-status" hidden></div>
    <div class="top-actions">
      <label class="theme-pick" title="How the run is shown; switching keeps the run">
        <span>Theme</span>
        <select id="theme">
          <option value="classic" selected>Classic</option>
          <option value="wired-3d">Wired 3D</option>
        </select>
      </label>
      <button id="follow" class="ghost on" type="button" title="Scroll to each stage as it starts">Follow</button>
      <button id="cancel" class="ghost" type="button" hidden>Cancel</button>
      <button id="delete" class="ghost danger" type="button" hidden>Delete sandbox</button>
    </div>
  </header>

  <main>
    <p class="hint" id="env-hint"></p>
    <div class="stage-area">
      <aside class="rail-wrap" aria-label="Stages">
        <ol class="rail" id="rail"></ol>
        <section class="recent" aria-label="Your recent sandboxes">
          <div class="recent-head"><span class="subhead">your recent sandboxes</span><span class="hint-inline" id="recent-ns"></span></div>
          <ol class="recent-list" id="recent"></ol>
        </section>
      </aside>
      <section class="focus" id="focus">
        <div class="focus-bar" id="focus-bar"></div>
        <ol class="flow" id="flow" aria-live="polite"></ol>
        <div class="finish" id="finish" hidden></div>
      </section>
    </div>
  </main>
  <div class="tip" id="tip" role="tooltip" hidden></div>

  <!-- The two forms, in the CLI's order. app.js moves each into its stage card. -->
  <div hidden>
    <form id="login-form" class="stage-form" data-form="login" novalidate>
      <div class="form-grid">
        <label class="wide"><span>Issuer <span class="req">required</span></span>
          <input data-k="issuer" type="url" required spellcheck="false" placeholder="https://dex.example.com"></label>
        <label>Client id<input data-k="clientId" type="text" spellcheck="false" placeholder="mediatore"></label>
        <label>Scopes<input data-k="scopes" data-list type="text" spellcheck="false" placeholder="openid, profile, email, groups, offline_access"></label>
        <label>Auth params<input data-k="authParams" data-list type="text" spellcheck="false" placeholder="key=value, key=value"></label>
        <label>Login hint<input data-k="loginHint" type="text" spellcheck="false" placeholder="optional"></label>
        <label>CA file (PEM)<input data-k="caFile" type="text" spellcheck="false" placeholder="private PKI only"></label>
        <label>Client secret file<input data-k="clientSecretFile" type="text" spellcheck="false" placeholder="Google installed-app clients"></label>
        <label>Redirect ports<input data-k="redirectPorts" data-list data-num type="text" spellcheck="false" placeholder="8000, 18000 (0: any)"></label>
        <label>Redirect host<input data-k="redirectHost" type="text" spellcheck="false" placeholder="localhost"></label>
        <label>Redirect path<input data-k="redirectPath" type="text" spellcheck="false" placeholder="none"></label>
        <label class="check"><input data-k="noBrowser" type="checkbox"> --no-browser (show the URL instead)</label>
        <label class="check"><input data-k="reuseSession" type="checkbox"> Reuse a fresh, unspent session</label>
      </div>
      <pre class="cmd" id="login-cmd"></pre>
      <div class="form-row">
        <div class="form-error" role="alert"></div>
        <button class="primary" type="submit">Log in</button>
      </div>
    </form>

    <form id="create-form" class="stage-form" data-form="create" novalidate>
      <label class="wide workload-label"><span>Workload <span class="hint-inline">IMAGE [ARG...]</span></span>
        <input id="workload" data-k="workload" class="workload" type="text" spellcheck="false" autocomplete="off" placeholder="IMAGE [ARG...]"></label>
      <div class="form-grid">
        <label><span>mediatore URL <span class="req">required</span></span><input data-k="url" type="url" spellcheck="false" placeholder="https://mediatore.example.com"></label>
        <label>CA file (PEM)<input data-k="caFile" type="text" spellcheck="false" placeholder="private PKI only"></label>
        <label>Namespace<input data-k="namespace" type="text" spellcheck="false" placeholder="broker default"></label>
        <label>Pool<input data-k="pool" type="text" spellcheck="false" placeholder="any pool"></label>
        <label>Pool selector<input data-k="poolSelector" data-list type="text" spellcheck="false" placeholder="key=value, key=value"></label>
        <label>Strategy
          <select data-k="strategy">
            <option value="">banlieue default</option>
            <option value="longest-ready">longest-ready</option>
            <option value="most-available">most-available</option>
            <option value="spread">spread</option>
          </select>
        </label>
        <label>TTL (s)<input data-k="ttl" type="number" min="60" step="60"></label>
        <label>Restart
          <select data-k="restart">
            <option value="never">never</option>
            <option value="on-failure">on-failure</option>
            <option value="always">always</option>
          </select>
        </label>
        <label>Audiences<input data-k="audiences" data-list type="text" spellcheck="false" placeholder="comma separated"></label>
        <label>Delegate<input data-k="delegate" data-list type="text" spellcheck="false" placeholder="anthropic=claude-code"></label>
        <label>Policy<input data-k="policy" type="text" spellcheck="false" placeholder="optional"></label>
        <label class="check"><input data-k="logs" type="checkbox"> --logs (capture output)</label>
        <label class="check"><input data-k="allowPlainHttp" type="checkbox"> --allow-plain-http</label>
      </div>
      <pre class="cmd" id="create-cmd"></pre>
      <div class="form-row">
        <div class="form-error" role="alert"></div>
        <button class="primary" type="submit" id="run">Run</button>
      </div>
    </form>
  </div>
</body>
</html>
