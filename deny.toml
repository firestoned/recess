#
# cargo-deny: licenses, advisories, bans, sources. The allowlist and the bans are
# mediatore's (permissive or foundation-governed licenses only; rustls on aws-lc-rs, so
# neither ring nor OpenSSL), since Low Tide links mediatore's client crate.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "OpenSSL", "CC0-1.0", "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { name = "openssl-sys", reason = "rustls only" },
  { name = "ring", reason = "aws-lc-rs is the only rustls provider, as in mediatore" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# mediatore-client and mediatore-proto, pinned to a commit in Cargo.toml.
allow-git = [
  "https://github.com/firestoned/mediatore",
]
