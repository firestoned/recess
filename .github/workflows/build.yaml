#
# Build gate: license headers, signed commits, fmt, clippy, tests, cargo-audit, cargo-deny,
# then the release binary for Linux (x86_64) and macOS (arm64), attached to a published
# release, and the server image: built on a pull request, pushed to GHCR, signed and
# attested on main and on a release. Mirrors mediatore's build.yaml at Recess's scale. All logic lives in Makefile
# targets; jobs only install tools and call make.
#
# No `paths:` filter: a required check that never triggers blocks the PR forever.

name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  release:
    types:
      - published
  # Reusable: a release pipeline can call the whole gate.
  workflow_call:
  workflow_dispatch:

# A newer run of the same event on the same ref cancels the older one; a release is never
# cancelled.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

# Top-level GITHUB_TOKEN is read-only (OpenSSF Scorecard Token-Permissions). The jobs that
# write (the image push, the release upload) declare it themselves.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A runner builds once: incremental state only slows the build and bloats the cache.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: 1

jobs:
  license-check:
    name: ⚖️ Verify SPDX License Headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check license headers
        uses: firestoned/github-actions/security/license-check@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          copyright-holder: "Erick Bourgeois, Recess"
          license-id: "Apache-2.0"

  verify-commits:
    name: 🔐 Verify Signed Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify commits (PR)
        if: github.event_name == 'pull_request'
        uses: firestoned/github-actions/security/verify-signed-commits@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-ref: origin/${{ github.base_ref }}
          verify-mode: pr

      - name: Verify commits (push to main)
        if: github.event_name == 'push'
        uses: firestoned/github-actions/security/verify-signed-commits@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          verify-mode: push

      - name: Verify commits (release)
        if: github.event_name == 'release'
        uses: firestoned/github-actions/security/verify-signed-commits@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          verify-mode: release

  format:
    name: 🎨 Check Formatting
    runs-on: ubuntu-latest
    needs: [license-check, verify-commits]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref: re-pin quarterly)
        with:
          components: rustfmt

      - name: Check formatting
        run: make fmt-check

  clippy:
    name: 📎 Clippy
    runs-on: ubuntu-latest
    needs: [format]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref: re-pin quarterly)
        with:
          components: clippy

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0

      - name: Run clippy
        run: make lint

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: [license-check, verify-commits]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref: re-pin quarterly)

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0

      - name: Run tests
        run: make test

  security:
    name: 🛡️ Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [verify-commits]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref: re-pin quarterly)

      - name: Run security scan
        uses: firestoned/github-actions/rust/security-scan@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          cargo-audit-version: "0.22.0"

  cargo-deny:
    name: 🧪 cargo-deny (License + Advisory + Sources)
    runs-on: ubuntu-latest
    needs: [verify-commits]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          log-level: warn
          command: check

  # The release binary, native on each runner: no cross-compile. Linux x86_64 for the build
  # hosts, macOS arm64 for a laptop (the login opens its browser, the Keychain holds
  # delegated credentials).
  dist:
    name: 🦀 Release Binary (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    needs: [clippy, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: darwin-arm64
            runner: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref: re-pin quarterly)

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0

      - name: Build
        run: make dist

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recess-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # The server image (Dockerfile, deploy/). A pull request builds it and nothing else: no
  # registry login, no write scope, no OIDC token, so an action version a pull request
  # proposes runs with a read-only token.
  image-check:
    name: 🐳 Server Image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [clippy, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Buildx alone: firestoned/github-actions' docker/setup-docker always logs in to GHCR,
      # and a pull request must not.
      - name: Set up Docker Buildx (no registry login)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (never pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          # Read only: main alone writes the cache.
          cache-from: type=gha

  # Pushed on main (`main`, `latest`, `sha-<commit>`) and on a release (its version alone:
  # v0.1.0 is `0.1.0`), signed keyless with Cosign by digest, and attested.
  image:
    name: 🐳 Server Image (publish)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [clippy, test]
    permissions:
      contents: read
      packages: write # GHCR push
      id-token: write # keyless Cosign and the attestation
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker (login + buildx)
        uses: firestoned/github-actions/docker/setup-docker@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          # A release of a commit main already built is a second build: it carries the
          # version alone, never a tag the main build owns (GHCR refuses the overwrite).
          tags: |
            type=ref,event=branch,enable=${{ github.event_name != 'release' }}
            type=sha,prefix=sha-,enable=${{ github.event_name != 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Written by main alone: a pull request reads main's cache and spends none of it.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
          sbom: true
          provenance: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Cosign sign (keyless, by digest)
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: 📦 Attach to Release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [dist, image, security, cargo-deny]
    permissions:
      contents: write # upload the binaries to the published release
    steps:
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: recess-*
          path: dist
          merge-multiple: true

      - name: Upload to the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
