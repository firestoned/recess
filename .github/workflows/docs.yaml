#
# The documentation site (docs/, MkDocs Material, strict): built on every pull request that
# touches what it is made of, published to GitHub Pages on each merge to main. The pages are the
# README and the repository's other documents, so a change to any of them rebuilds it. All logic
# lives in the Makefile (`make docs`); the job installs tools and calls it.

name: Documentation

on:
  pull_request:
    paths: &docs-paths
      - 'docs/**'
      - '*.md'
      - 'deploy/README.md'
      - 'assets/theatre.js'
      - 'assets/agentsandbox.js'
      - 'scripts/docs-*'
      - '.github/workflows/docs.yaml'
      - '.github/requirements/**'
  push:
    branches:
      - main
    paths: *docs-paths
  workflow_dispatch:

# Read-only by default (OpenSSF Scorecard Token-Permissions); the deploy job takes what Pages needs.
permissions:
  contents: read

# A newer build of the same ref cancels the older one; a deploy is never cancelled halfway.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 📚 Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Poetry
        # Hash-locked (Scorecard Pinned-Dependencies). Bump POETRY_VERSION in
        # .github/requirements/poetry.in, then regenerate:
        #   uv pip compile --python-version 3.11 --python-platform linux --generate-hashes \
        #     --output-file=.github/requirements/poetry.txt .github/requirements/poetry.in
        run: |
          python3 -m pip install --user --require-hashes -r .github/requirements/poetry.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache the docs' virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/.venv
          key: ${{ runner.os }}-docs-venv-${{ hashFiles('docs/poetry.lock') }}

      - name: Build documentation
        run: make docs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site

  deploy:
    name: 🚀 Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the site
      id-token: write # the Pages deployment's OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
