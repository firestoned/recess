#
# Dependency updates, weekly, each ecosystem with a 7-day cooldown (Dependabot waits after a
# version is published before proposing it). Keeps the SHA-pinned actions current.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Rust crates. The mediatore git pin is moved by hand, with the broker it runs against.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]

  # The Dockerfile's base images, pinned by digest.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
