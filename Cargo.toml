[package]
name = "low-tide"
description = "Low Tide: watch a workload go through mediatore, from minting the token to the exit code, with every secret on the map (web and TUI)"
repository = "https://github.com/firestoned/low-tide"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

# Its own workspace, not a member of mediatore's.
[workspace]

[dependencies]
# mediatore's own client and wire types, pinned to a commit of firestoned/mediatore: the login,
# the claim and the output stream are the CLI's code, not a copy. Move the pin with the broker
# you run against; to build against a local checkout, see the README's [patch] recipe.
mediatore-client = { git = "https://github.com/firestoned/mediatore", rev = "4dfb9f1775e14edd05eced08763ea214eba4e8ff" }
mediatore-proto  = { git = "https://github.com/firestoned/mediatore", rev = "4dfb9f1775e14edd05eced08763ea214eba4e8ff" }

tokio       = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
tokio-util  = { version = "0.7", default-features = false }
futures     = "0.3"
axum        = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap        = { version = "4", features = ["derive", "env"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
jiff        = { version = "0.2", default-features = false, features = ["std", "serde"] }
base64      = "0.22"
sha2        = "0.10"
hex         = "0.4"
aws-lc-rs   = "1"
# The kube major follows mediatore's (which follows banlieue-api); rustls on aws-lc-rs, no ring.
kube        = { version = "5", default-features = false, features = ["client", "config", "runtime", "rustls-tls"] }
k8s-openapi = { version = "0.29", features = ["latest"] }
ratatui     = "0.30"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
too_many_lines = "allow"
# Prose-heavy docs (and clap help text): backticks would show up in --help.
doc_markdown = "allow"
