[package]
name = "recess"
description = "Recess: watch a workload go through mediatore, from minting the token to the exit code, with every secret on the map (web and TUI)"
repository = "https://github.com/firestoned/recess"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

# Its own workspace, not a member of mediatore's.
[workspace]

[dependencies]
# mediatore's own client and wire types, pinned to a commit of firestoned/mediatore: the login,
# the claim and the output stream are the CLI's code, not a copy. Move the pin with the broker
# you run against; to build against a local checkout, see the README's [patch] recipe.
mediatore-client = { git = "https://github.com/firestoned/mediatore", rev = "4dfb9f1775e14edd05eced08763ea214eba4e8ff" }
# The broker client's HTTP response type, named for the admin page's output stream; the same
# version mediatore-client pulls in, no features of its own.
reqwest     = { version = "0.13", default-features = false, features = ["json", "form"] }
# The bearer layer on each signed-in user's kube client.
tower       = { version = "0.5", default-features = false, features = ["util"] }
mediatore-proto  = { git = "https://github.com/firestoned/mediatore", rev = "4dfb9f1775e14edd05eced08763ea214eba4e8ff" }

tokio       = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "io-util"] }
tokio-util  = { version = "0.7", default-features = false }
futures     = "0.3"
axum        = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap        = { version = "4", features = ["derive", "env"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
jiff        = { version = "1.0", default-features = false, features = ["std", "serde"] }
base64      = "0.23"
sha2        = "0.11"
hex         = "0.4"
aws-lc-rs   = "1"
# The kube major follows mediatore's (which follows banlieue-api); rustls on aws-lc-rs, no ring.
# http-proxy and socks5: the cluster through the kubeconfig's proxy-url or HTTPS_PROXY (with NO_PROXY).
kube        = { version = "5.2", default-features = false, features = ["client", "config", "runtime", "rustls-tls", "http-proxy", "socks5"] }
k8s-openapi = { version = "0.29", features = ["latest"] }
ratatui     = "0.30"
x509-parser = { version = "0.18", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
rustls = { version = "0.23", default-features = false }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
too_many_lines = "allow"
# Prose-heavy docs (and clap help text): backticks would show up in --help.
doc_markdown = "allow"
