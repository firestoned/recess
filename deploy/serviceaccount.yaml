#
# Recess's own identity is bound to nothing and its token is never mounted: every read is made
# with the signed-in person's token. The pod gets only the cluster's CA (deployment.yaml).
#
# NEVER bind it to any Role or ClusterRole, grant it `impersonate`, or mount its token. Recess
# must never hold access of its own: see deploy/README.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recess
automountServiceAccountToken: false
