# Plain HTTP inside the cluster; put a TLS ingress in front of it (RECESS_PUBLIC_URL is https).
apiVersion: v1
kind: Service
metadata:
  name: recess
  labels:
    app.kubernetes.io/name: recess
spec:
  selector:
    app.kubernetes.io/name: recess
  ports:
    - name: http
      port: 80
      targetPort: http
