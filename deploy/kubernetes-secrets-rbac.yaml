#
# The Kubernetes view's vaults: every Secret's name, and its drawer pulled open. Not in
# kustomization.yaml: apply it on its own, for the few who should have it.
#
# Recess lists Secrets as metadata only and reads one value only when a drawer is opened,
# but RBAC cannot grant less than list, watch and get, and those let the holder read every
# value by other means. Grant this with care. Without it, each vault is shown locked and
# empty: the boxes are listed across the whole cluster, so a RoleBinding in one namespace
# does not fill that namespace's vault.
#
# NEVER bind the `recess` ServiceAccount, or anything Recess runs as, to this or any other role.
# Recess holds no access of its own, by design: these are for people (users or groups) only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: recess-kubernetes-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: recess-kubernetes-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: recess-kubernetes-secrets
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "github:example-org:platform-admins"
